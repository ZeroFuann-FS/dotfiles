# kitty · tema ZeroFuann (violeta nocturno)

# Fuente
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
font_size        11.5
disable_ligatures never

# Ventana
window_padding_width 14
background_opacity   0.90
background_blur      32
confirm_os_window_close 0
remember_window_size  no
initial_window_width  112c
initial_window_height 36c
enable_audio_bell no
cursor_shape beam
cursor_blink_interval 0.6
scrollback_lines 10000
copy_on_select yes
url_style curly

# Pestañas
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   round
tab_bar_min_tabs      2
tab_title_template    " {index}: {title} "

# Colores

# Negro, rojo, verde, amarillo, azul, magenta, cian, blanco (normal / brillante)

# Atajos estilo macOS/navegador
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0

# Colores
# ── Divisiones (idea #9 de "Mi terminal") ─────────────────────
enabled_layouts splits,stack
inactive_text_alpha 0.65
window_border_width 1pt
window_margin_width 2
map ctrl+shift+d launch --location=vsplit --cwd=current
map ctrl+shift+b launch --location=hsplit --cwd=current
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down
map ctrl+shift+z toggle_layout stack
map ctrl+shift+r start_resizing_window
map ctrl+shift+l layout_action rotate

# ── Aviso al terminar (idea #10) ───────────────────────────────
# Notificación de KDE cuando un comando de más de 15 s acaba y no estás viendo esa ventana
notify_on_cmd_finish unfocused 15.0 notify

include carbon.conf
