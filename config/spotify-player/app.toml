# spotify_player (idea #14 de "Mi terminal") — estilo Carbon
theme = "carbon"
border_type = "Rounded"
progress_bar_type = "Rectangle"
playback_window_position = "Top"
enable_media_control = true
enable_notify = false

# bug #1114: si hay que volver a entrar, paso 1 con /ncspot_login y paso 2 con /login
login_redirect_uri = "http://127.0.0.1:8989/login"

# portada del disco (kitty la dibuja como imagen)
cover_img_length = 9
cover_img_width = 5
cover_img_scale = 1.0

[device]
name = "kitty de ZeroFuann"
device_type = "computer"
volume = 70
bitrate = 320
normalization = false
